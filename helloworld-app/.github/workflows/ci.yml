# =============================================================================
# FILE: .github/workflows/ci.yml
# PURPOSE: Continuous Integration Pipeline
# TRIGGER: On push and pull requests
# =============================================================================

name: CI Pipeline - Build, Test & Security Scan

# TRIGGERS: Define when this workflow runs
on:
  push:
    branches: 
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches: 
      - main
      - develop

# ENVIRONMENT VARIABLES: Available to all jobs
env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

# JOBS: Independent tasks that can run in parallel or sequence
jobs:
  
  # =============================================================================
  # JOB 1: BUILD AND UNIT TEST
  # =============================================================================
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    
    # OUTPUTS: Data to pass to dependent jobs
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    
    steps:
      # STEP 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for better analysis
      
      # STEP 2: Set up Java environment
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'  # Cache Maven dependencies
      
      # STEP 3: Extract version from pom.xml
      - name: Extract project version
        id: version
        working-directory: helloworld-app
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Project version: $VERSION"
      
      # STEP 4: Compile the code
      - name: Compile source code
        working-directory: helloworld-app
        run: mvn clean compile -DskipTests
      
      # STEP 5: Run unit tests
      - name: Run unit tests
        working-directory: helloworld-app 
        run: mvn test
      
      # STEP 6: Generate code coverage report
      - name: Generate code coverage
        working-directory: helloworld-app
        run: mvn jacoco:report
      
      # STEP 7: Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: helloworld-app/target/surefire-reports/
          retention-days: 30
      
      # STEP 8: Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: helloworld-app/target/site/jacoco/
          retention-days: 30
      
      # STEP 9: Build JAR artifact
      - name: Package application
        working-directory: helloworld-app
        run: mvn package -DskipTests
      
      # STEP 10: Set artifact name
      - name: Set artifact name
        id: artifact
        run: |
          ARTIFACT_NAME="helloworld-${{ steps.version.outputs.version }}.jar"
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
      
      # STEP 11: Upload JAR for next jobs
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: helloworld-app/target/*.jar
          retention-days: 7

  # =============================================================================
  # JOB 2: CODE QUALITY ANALYSIS
  # Depends on: None (runs in parallel with build)
  # =============================================================================
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # Static code analysis
      - name: Run Checkstyle
        working-directory: helloworld-app
        run: mvn checkstyle:check
        continue-on-error: true
      
      - name: Run PMD
        working-directory: helloworld-app 
        run: mvn pmd:check
        continue-on-error: true
      
      - name: Run SpotBugs
        working-directory: helloworld-app
        run: mvn spotbugs:check
        continue-on-error: true
      
      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            helloworld-app/target/checkstyle-result.xml
            helloworld-app/target/pmd.xml
            helloworld-app/target/spotbugsXml.xml

  # =============================================================================
  # JOB 3: SECURITY SCANNING
  # Depends on: build (needs the compiled code)
  # =============================================================================
  security-scan:
    name: Security Vulnerability Scan
    if: false   # DISABLED FOR DEMO
    runs-on: ubuntu-latest
    needs: build  # DEPENDENCY: Wait for build job
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # Check for vulnerable dependencies
      - name: OWASP Dependency Check
        working-directory: helloworld-app
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=dependency-check-suppressions.xml
        continue-on-error: true
      
      # Scan for secrets in code
      - name: Secret Scanner (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Trivy security scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            helloworld-app/target/dependency-check-report.html
            trivy-results.sarif

  # =============================================================================
  # JOB 4: DOCKER BUILD
  # Depends on: build, security-scan
  # =============================================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build  # MULTIPLE DEPENDENCIES. Changing [build, security-scan] to build for demo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      # Download JAR from build job
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: helloworld-app/target/
      
      # Set up Docker Buildx for advanced builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      # Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./helloworld-app
          file: ./helloworld-app/Dockerfile
          push: false
          load: true
          tags: |
            helloworld-app:${{ needs.build.outputs.version }}
            helloworld-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Scan Docker image for vulnerabilities
      - name: Scan Docker image with Trivy
        if: false    # DISABLED FOR DEMO
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'helloworld-app:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      
      # Save Docker image as artifact
      - name: Save Docker image
        run: |
          docker save helloworld-app:latest | gzip > helloworld-app.tar.gz
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: helloworld-app.tar.gz
          retention-days: 7

  # =============================================================================
  # JOB 5: INTEGRATION TESTS
  # Depends on: docker-build
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      - name: Load Docker image
        run: |
          gunzip -c helloworld-app.tar.gz | docker load
      
      - name: Run container for testing
        run: |
          docker run -d -p 8080:8080 --name test-container helloworld-app:latest
          sleep 10  # Wait for app to start
      
      - name: Health check
        run: |
          curl -f http://localhost:8080/actuator/health || exit 1
      
      - name: Test Hello World endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:8080/)
          echo "Response: $RESPONSE"
          if [[ "$RESPONSE" != *"Hello World"* ]]; then
            echo "Test failed: Expected 'Hello World' in response"
            exit 1
          fi
          echo "✅ Integration test passed!"
      
      - name: Stop container
        if: always()
        run: docker stop test-container

  # =============================================================================
  # JOB 6: BUILD SUMMARY
  # Depends on: All previous jobs
  # =============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, code-quality, security-scan, docker-build, integration-tests]
    if: always()  # Run even if previous jobs failed
    
    steps:
      - name: Generate build summary
        run: |
          echo "# 🚀 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** ${{ needs.build.outputs.artifact-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY


